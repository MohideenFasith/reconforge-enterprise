[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "reconforge-enterprise"
version = "0.1.0"
description = "Self-contained financial reconciliation and exception-management backend"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary"}
authors = [{name = "Mohideen Fasith"}]
dependencies = [
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "prometheus-client==0.25.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "python-json-logger==4.0.0",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.0.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[project.scripts]
reconforge = "reconforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=reconforge --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["reconforge"]

[tool.coverage.report]
skip_covered = true
show_missing = true
omit = ["src/reconforge/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reconforge"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "prometheus_client.*"
ignore_missing_imports = true
