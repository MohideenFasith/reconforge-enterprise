name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python scripts/check_lock.py
      - run: python scripts/check_no_padding.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: pytest -q --cov=reconforge --cov-fail-under=80

  smoke:
    runs-on: ubuntu-latest
    needs: [reproducibility, lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reconforge-ci .
      - run: docker run -d --rm --name reconforge -p 8000:8000 -e RECONFORGE_API_KEYS=ci-key:ci:default:admin+analyst reconforge-ci
      - run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs reconforge
          exit 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock
